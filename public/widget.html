<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>老己</title>
  <script>
    (function(){try{var m=localStorage.getItem('tj_theme')||'system';var t=m==='system'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):m;document.documentElement.dataset.theme=t;}catch(e){}})();
  </script>
  <link rel="stylesheet" href="/theme.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: transparent;
      font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; user-select: none; padding: 18px;
    }

    /* 透明玻璃浮窗 —— 真正透明靠 Electron transparent:true；浏览器里呈毛玻璃质感 */
    .widget {
      width: min(94vw, 400px); height: min(86vh, 580px);
      display: flex; flex-direction: column; overflow: hidden; position: relative;
      background: var(--w-bg);
      -webkit-backdrop-filter: blur(26px) saturate(170%);
      backdrop-filter: blur(26px) saturate(170%);
      border-radius: 24px;
      box-shadow: var(--w-shadow);
      color: var(--text);
      animation: windowIn .55s cubic-bezier(.22, 1, .36, 1);
    }
    @keyframes windowIn {
      from { opacity: 0; transform: translateY(16px) scale(.955); }
      to   { opacity: 1; transform: none; }
    }

    /* 渐变描边：一层发丝级高光，提升"精致感" */
    .widget::before {
      content: ""; position: absolute; inset: 0; border-radius: 24px; padding: 1px;
      background: linear-gradient(155deg, var(--hairline-a), rgba(255,255,255,.05) 42%, var(--hairline-b));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      pointer-events: none;
    }

    /* 极简拖拽条：不占视觉空间 */
    .bar {
      -webkit-app-region: drag;
      height: 40px; flex: 0 0 auto; position: relative; z-index: 2;
      display: flex; align-items: center; gap: 8px; padding: 0 12px;
      border-bottom: 1px solid var(--border-weak);
    }
    .bar .logo {
      width: 22px; height: 22px; display: block;
      border-radius: 5px;
      box-shadow: 0 2px 6px rgba(0,0,0,.4);
    }
    .bar .name { font-size: 13px; font-weight: 700; color: var(--text); letter-spacing: 1px; }
    .bar .spacer { flex: 1; }
    .bar .mini {
      -webkit-app-region: no-drag;
      width: 26px; height: 26px; padding: 0;
      border-radius: 9px;
      border: 1px solid rgba(55,138,221,.4);
      background: linear-gradient(135deg, rgba(55,138,221,.14), rgba(127,119,221,.14));
      color: var(--name);
      cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      transition: background .15s, transform .15s, border-color .15s;
    }
    .bar .mini:hover {
      background: linear-gradient(135deg, rgba(55,138,221,.3), rgba(127,119,221,.3));
      border-color: rgba(55,138,221,.7);
      transform: translateY(-1px);
    }
    .bar .mini:active { transform: translateY(0); }
    .bar .mini svg { display: block; }
    .bar .mini.close {
      background: linear-gradient(135deg, rgba(248,81,73,.78), rgba(248,81,73,.6));
      color: #fff; border-color: rgba(248,81,73,.6);
    }
    .bar .mini.close:hover { background: rgba(248,81,73,.95); border-color: rgba(248,81,73,.85); }

    /* ====== 顶部舞台：默认隐藏；用户在「个性化」里设置图片后才显示 ====== */
    .stage {
      flex: 0 0 auto; display: none; position: relative;
      height: 128px; overflow: hidden;
      border-bottom: 1px solid var(--border-weak);
    }
    .stage.has-image { display: block; }
    .stage img, .stage video {
      width: 100%; height: 100%; object-fit: cover; display: block;
      animation: windowIn .55s ease;
    }
    /* 图片上的状态浮条（仅在有图时显示） */
    .stage .stage-status {
      position: absolute; left: 12px; bottom: 10px;
      font-size: 11.5px; color: #fff; letter-spacing: .3px;
      background: rgba(0,0,0,.42); padding: 4px 10px; border-radius: 20px;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      max-width: 80%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* 个性化设置弹层 */
    .pop {
      position: absolute; top: 46px; right: 10px; z-index: 20; width: 296px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 18px; color: var(--text);
      box-shadow: 0 24px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.02);
      display: none; -webkit-app-region: no-drag;
      animation: pop .28s cubic-bezier(.22,1,.36,1);
    }
    .pop.show { display: block; }

    /* 分段 */
    .pop-divider { height: 1px; background: var(--border); margin: 18px -18px; }
    .pop-section-head { display: flex; align-items: baseline; justify-content: space-between;
      margin-bottom: 10px; gap: 8px; }
    .pop-section-title { font-size: 13px; color: var(--name); font-weight: 700; letter-spacing: -.01em; }
    .pop-section-hint { font-size: 11px; color: var(--muted-2); }

    /* 预览区 */
    .pop .preview {
      position: relative; width: 100%; height: 112px; border-radius: 12px;
      background: var(--surface-2) center/cover no-repeat;
      border: 1px dashed var(--border); overflow: hidden;
      transition: border-color .2s;
    }
    .pop .preview.has-image { border-style: solid; border-color: var(--border-weak); }
    .pop .preview img, .pop .preview video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pop .preview-empty {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 6px; color: var(--muted); font-size: 12px;
    }
    .pop .preview-empty svg { opacity: .5; }
    .pop .preview-empty b { font-weight: 500; }
    .pop .preview-empty small { font-size: 10.5px; color: var(--muted-2); }

    /* 文件元信息 */
    .pop .meta { display: none; align-items: center; justify-content: space-between;
      font-size: 11px; color: var(--muted-2); margin: 8px 2px 0;
      font-variant-numeric: tabular-nums; }
    .pop .meta.show { display: flex; }
    .pop .meta b { color: var(--text); font-weight: 600; max-width: 60%;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* 操作按钮 */
    .pop .actions { display: flex; gap: 8px; margin-top: 10px; }
    .pop .pbtn {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 9px 12px; border-radius: 11px; cursor: pointer;
      border: 1px solid var(--border); background: var(--btn-ghost); color: var(--text);
      font-size: 12.5px; font-weight: 500; font-family: inherit;
      transition: background .15s, border-color .15s, transform .1s, box-shadow .15s;
    }
    .pop .pbtn:hover { background: var(--btn-ghost-hover); transform: translateY(-1px); }
    .pop .pbtn:active { transform: translateY(0); }
    .pop .pbtn:disabled { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }
    .pop .pbtn svg { flex-shrink: 0; }
    .pop .pbtn.primary {
      background: linear-gradient(135deg, #1f6feb, #378ADD);
      border-color: rgba(255,255,255,.2); color: #fff;
      box-shadow: 0 4px 12px rgba(55,138,221,.3), inset 0 1px 0 rgba(255,255,255,.15);
    }
    .pop .pbtn.primary:hover {
      background: linear-gradient(135deg, #2878ff, #4a9aff);
      box-shadow: 0 6px 18px rgba(55,138,221,.4), inset 0 1px 0 rgba(255,255,255,.18);
    }
    .pop .pbtn.danger { color: #ffc9c9; }
    .pop .pbtn.danger:hover { background: rgba(248,81,73,.15); border-color: rgba(248,81,73,.4); color: #ff9b9b; }

    /* 主题分段控件 */
    .pop .theme-seg-new {
      display: flex; gap: 4px; padding: 4px;
      background: var(--surface-2); border-radius: 12px; border: 1px solid var(--border);
    }
    .pop .theme-seg-new .topt {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px;
      padding: 7px 4px; border-radius: 9px; border: 0; background: transparent;
      color: var(--muted); cursor: pointer; font-size: 11.5px; font-weight: 500;
      transition: all .15s; font-family: inherit;
    }
    .pop .theme-seg-new .topt:hover { color: var(--text); background: rgba(255,255,255,.04); }
    .pop .theme-seg-new .topt.active {
      background: linear-gradient(135deg, #1f6feb, #378ADD); color: #fff; font-weight: 600;
      box-shadow: 0 2px 8px rgba(55,138,221,.35), inset 0 1px 0 rgba(255,255,255,.15);
    }
    .pop .theme-seg-new .topt svg { opacity: .8; }
    .pop .theme-seg-new .topt.active svg { opacity: 1; }

    /* 聊天区（透出玻璃底色） */
    .chat { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 11px; position: relative; z-index: 1; }
    .chat::-webkit-scrollbar { width: 5px; }
    .chat::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 3px; }

    .empty { color: var(--muted-2); text-align: center; padding: 40px 14px; font-size: 13px; line-height: 1.7; margin: auto; }

    .msg {
      max-width: 88%; padding: 10px 13px; border-radius: 16px;
      font-size: 13.5px; line-height: 1.6; word-break: break-word;
      animation: pop .3s cubic-bezier(.22, 1, .36, 1);
    }
    @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }
    .msg .head { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
    .msg .av { width: 19px; height: 19px; border-radius: 50%; font-size: 10px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; }
    .msg .nm { font-size: 11px; font-weight: 600; }
    .msg img { max-width: 180px; max-height: 110px; border-radius: 10px; margin-bottom: 4px; display: block; border: 1px solid var(--border); }
    .msg-user { align-self: flex-end; background: linear-gradient(135deg, #cfe6ff, #a9d3ff); color: #0a2540; border-bottom-right-radius: 5px; box-shadow: 0 4px 14px rgba(56,139,253,.22); }
    .msg-user .head { display: none; }
    .msg-id { align-self: flex-start; background: rgba(248,129,102,.13); border: 1px solid rgba(248,129,102,.38); border-bottom-left-radius: 5px; }
    .msg-id .av { background: #f78166; } .msg-id .nm { color: #f78166; }
    .msg-ego { align-self: flex-start; background: rgba(126,231,135,.11); border: 1px solid rgba(126,231,135,.36); border-bottom-left-radius: 5px; }
    .msg-ego .av { background: #7ee787; } .msg-ego .nm { color: #7ee787; }
    .msg-superego { align-self: flex-start; background: rgba(210,168,255,.11); border: 1px solid rgba(210,168,255,.36); border-bottom-left-radius: 5px; }
    .msg-superego .av { background: #d2a8ff; } .msg-superego .nm { color: #d2a8ff; }

    /* 思考中：纯静默占位元素（不渲染任何可见内容） */
    .thinking { display: none; }

    .input {
      padding: 9px 12px; background: var(--surface-2);
      border-top: 1px solid var(--border-weak);
      display: flex; gap: 8px; align-items: flex-end; flex: 0 0 auto; -webkit-app-region: no-drag; position: relative; z-index: 2;
    }
    .input textarea {
      flex: 1; padding: 9px 12px; background: var(--input-bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 16px; font-size: 13px;
      outline: none; resize: none; font-family: inherit; line-height: 1.45;
      min-height: 38px; max-height: 90px; transition: border-color .15s, box-shadow .15s;
    }
    .input textarea:focus { border-color: #378ADD; box-shadow: 0 0 0 3px rgba(55,138,221,.18); }
    .input button {
      padding: 8px 16px; background: linear-gradient(135deg, #1f6feb, #378ADD); color: #fff;
      border: 1px solid rgba(255,255,255,.18); border-radius: 16px;
      cursor: pointer; font-size: 13px; font-weight: 600; flex: 0 0 auto; transition: filter .15s, transform .12s;
    }
    .input button:hover { filter: brightness(1.08); }
    .input button:active { transform: scale(.96); }
    .input button:disabled { opacity: .5; cursor: not-allowed; filter: none; transform: none; }

    .hint { font-size: 10.5px; color: var(--muted-2); text-align: center; padding: 4px 8px; flex: 0 0 auto; -webkit-app-region: no-drag; position: relative; z-index: 2; }
    .safety { color: #f85149; font-size: 10.5px; text-align: center; padding: 3px; flex: 0 0 auto; }
    .sources { font-size: 10.5px; color: var(--muted); margin: 6px 2px 2px; padding: 6px 8px; background: var(--link-bg); border: 1px solid var(--link-border); border-radius: 8px; flex: 0 0 auto; -webkit-app-region: no-drag; }
    .sources summary { cursor: pointer; color: #58a6ff; user-select: none; }
    .sources a { color: #58a6ff; text-decoration: none; display: block; padding: 2px 0; word-break: break-all; }
    .sources a:hover { text-decoration: underline; }

    /* 字数计数：超过上限变红并禁用发送 */
    .counter { font-size: 10px; color: var(--muted-2); flex: 0 0 auto; -webkit-app-region: no-drag; font-variant-numeric: tabular-nums; padding: 0 12px 4px; text-align: right; position: relative; z-index: 2; }
    .counter.warn { color: #f85149; font-weight: 600; }

    /* 粘贴截图预览：可移除的小缩略图 */
    .img-prev { flex: 0 0 auto; padding: 6px 12px 0; -webkit-app-region: no-drag; display: none; position: relative; z-index: 2; }
    .img-prev.show { display: block; }
    .img-prev .chip {
      display: inline-flex; align-items: center; gap: 7px; background: var(--surface-2);
      border: 1px solid var(--border); border-radius: 12px; padding: 4px 6px 4px 4px; max-width: 100%;
    }
    .img-prev img { height: 34px; width: 34px; object-fit: cover; border-radius: 8px; display: block; }
    .img-prev .nm { font-size: 11px; color: var(--name); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .img-prev .x {
      width: 18px; height: 18px; border-radius: 50%; border: none; background: rgba(248,81,73,.85); color: #fff;
      cursor: pointer; font-size: 11px; line-height: 1; flex: 0 0 auto;
    }
    .img-prev .x:hover { background: rgb(248,81,73); }

    /* 启动自检横幅：连接后端时显示，避免「启动竞态」下的静默连接失败 */
    .banner { display: none; align-items: center; gap: 8px; flex: 0 0 auto; padding: 9px 12px; font-size: 12px; line-height: 1.5; -webkit-app-region: no-drag; position: relative; z-index: 2; }
    .banner code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; font-size: 11.5px; }
    .banner.checking { color: var(--name); background: rgba(56,139,253,.16); }
    .banner.err { color: #ffc9c9; background: rgba(248,81,73,.18); border-top: 1px solid rgba(248,81,73,.4); }
    .banner.ok { color: #7ee787; background: rgba(63,185,80,.12); }
    .spin { width: 12px; height: 12px; border: 2px solid rgba(255,255,255,.3); border-top-color: var(--name); border-radius: 50%; animation: spin .8s linear infinite; flex: 0 0 auto; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 自我（老大）最终结论：突出显示 */
    .msg-ego.boss { background: rgba(126,231,135,.18); border: 1px solid rgba(126,231,135,.55); box-shadow: 0 0 0 1px rgba(126,231,135,.18), 0 6px 18px rgba(126,231,135,.12); }
    .msg-ego.boss .nm::after { content: " · 老大拍板"; color: #7ee787; font-size: 10px; opacity: .85; font-weight: 400; }
  </style>
</head>
<body>
  <div class="widget">
    <div class="bar">
      <img class="logo" src="assets/laoji-logo.png" width="22" height="22" alt="老己">
      <div class="name">老己</div>
      <div class="spacer"></div>
      <button class="mini" onclick="TriuneImport && TriuneImport.open()" title="导入旧日记，自动生成气质画像" aria-label="导入旧日记">
        <svg class="bubble-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="1.5" y="2.5" width="13" height="11" rx="3" fill="rgba(55,138,221,.18)" stroke="currentColor" stroke-width="1.5"/>
          <path d="M5.5 13.5 L5.5 16.5 L8.5 13.5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" fill="rgba(55,138,221,.18)"/>
          <rect x="9" y="10" width="13" height="11" rx="3" fill="rgba(55,138,221,.18)" stroke="currentColor" stroke-width="1.5"/>
          <path d="M15.5 21 L15.5 24 L18.5 21" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" fill="rgba(55,138,221,.18)"/>
        </svg>
      </button>
      <button class="mini" onclick="togglePop()" title="个性化" aria-label="个性化">
        <svg class="bubble-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.7-.4 2-.9.2-.4.2-.9 0-1.4-.2-.4-.2-.9 0-1.3.2-.4.7-.7 1.2-.7H17a4 4 0 0 0 4-4 4 4 0 0 0-4-4h-1.2c-.5 0-1-.3-1.2-.7-.2-.4-.2-.9 0-1.3.2-.5.2-1 0-1.4-.3-.5-.9-.9-2-.9z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          <circle cx="7.5" cy="11.5" r="1" fill="currentColor"/>
          <circle cx="12" cy="7.5" r="1" fill="currentColor"/>
          <circle cx="16" cy="11" r="1" fill="currentColor"/>
        </svg>
      </button>
      <button class="mini" onclick="window.electronAPI?.openKnowledge()" title="知识库" aria-label="知识库">
        <svg class="bubble-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 4.5h6a3 3 0 0 1 3 3v13M20 4.5h-6a3 3 0 0 0-3 3v13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 4.5v13h6a3 3 0 0 1 3 3M20 4.5v13h-6a3 3 0 0 0-3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="mini" onclick="window.electronAPI ? window.electronAPI.openChatlog() : window.open('/chatlog.html','_blank')" title="聊天日志" aria-label="聊天日志">
        <svg class="bubble-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="4.5" y="3" width="15" height="18" rx="2.5" stroke="currentColor" stroke-width="1.5"/>
          <path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
      <button class="mini" onclick="window.electronAPI?.minimize()" title="隐藏" aria-label="隐藏">
        <svg class="bubble-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 12h14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
      </button>
      <button class="mini close" onclick="window.electronAPI?.close()" title="关闭" aria-label="关闭">
        <svg class="bubble-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6.5 6.5l11 11M17.5 6.5l-11 11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div class="banner" id="banner"></div>

    <!-- 顶部舞台：默认隐藏；用户在「个性化」里设置图片后才显示 -->
    <div class="stage" id="stage">
      <div id="stageMedia"></div>
      <div class="stage-status" id="petStatus">在陪着你</div>
    </div>

    <!-- 个性化设置弹层 -->
    <div class="pop" id="pop">
      <!-- 顶部图片 -->
      <div>
        <div class="pop-section-head">
          <span class="pop-section-title">顶部形象</span>
          <span class="pop-section-hint">不设则不显示舞台</span>
        </div>
        <div class="preview" id="popPreview">
          <div class="preview-empty" id="popEmpty">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="14" rx="2.5"/>
              <circle cx="9" cy="11" r="1.6"/>
              <path d="M21 17l-5-5-7 7"/>
            </svg>
            <b>未设置图片</b>
            <small>支持 图片 / GIF / 视频(MP4·WebM)</small>
          </div>
        </div>
        <div class="meta" id="popMeta">
          <b id="popMetaName">—</b>
          <span id="popMetaSize">—</span>
        </div>
        <div class="actions">
          <button class="pbtn primary" id="popPickBtn" type="button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <path d="M17 8l-5-5-5 5"/>
              <path d="M12 3v12"/>
            </svg>
            <span>选择图片 / 视频</span>
          </button>
          <button class="pbtn danger" id="popClearBtn" type="button" disabled>移除</button>
        </div>
        <input type="file" id="fileInput" accept="image/*,video/*" style="display:none" />
      </div>

      <div class="pop-divider"></div>

      <!-- 主题 -->
      <div>
        <div class="pop-section-head">
          <span class="pop-section-title">主题</span>
          <span class="pop-section-hint">老己的视觉风格</span>
        </div>
        <div class="theme-seg-new">
          <button class="topt" data-theme-opt="light" type="button">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
            </svg>
            <span>浅色</span>
          </button>
          <button class="topt" data-theme-opt="dark" type="button">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
            <span>深色</span>
          </button>
          <button class="topt" data-theme-opt="system" type="button">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="14" rx="2"/>
              <path d="M2 20h20"/>
            </svg>
            <span>跟随</span>
          </button>
        </div>
      </div>
    </div>

    <div class="chat" id="chat">
      <div class="empty">在这里说说你的事<br>或截图后 Ctrl+V 粘贴</div>
    </div>
    <div class="hint">截图 Ctrl+V 粘贴 · Ctrl+Shift+J 显隐</div>
    <div class="img-prev" id="imgPrev">
      <div class="chip">
        <img id="imgPrevImg" alt="截图" />
        <span class="nm">截图已就绪</span>
        <button class="x" id="imgPrevX" title="移除截图">×</button>
      </div>
    </div>
    <div class="input">
      <textarea id="input" rows="1" placeholder="说说你的事..." onkeydown="handleKey(event)" oninput="onInput()" disabled></textarea>
      <button id="btn" onclick="send()" disabled>发送</button>
    </div>
    <div class="counter" id="counter">0 / 5000</div>
  </div>
<script>
let sending = false;
let pendingImage = null;
let backendReady = false;   // 启动自检通过后才放行输入
let healthTimer = null;
let idleTimer = null;

// 状态机：仅更新状态浮条文案（顶部舞台有图时才可见）
function setMood(mood, status) {
  const st = document.getElementById("petStatus");
  if (status != null && st) st.textContent = status;
  if (mood === "idle") {
    clearTimeout(idleTimer);
  } else {
    // 非 idle 状态在安静 6s 后自动回到 idle
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => setMood("idle", "在陪着你"), 6000);
  }
}

// 图片粘贴
document.addEventListener("paste", async (e) => {
  const items = e.clipboardData?.items;
  if (!items) return;
  for (const item of items) {
    if (item.type.startsWith("image/")) {
      e.preventDefault();
      const blob = item.getAsFile();
      const reader = new FileReader();
      reader.onload = () => {
        pendingImage = reader.result;
        showImgPreview();
        document.getElementById("input").focus();
      };
      reader.readAsDataURL(blob);
      return;
    }
  }
});

function handleKey(e) {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
}
function autoResize(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 90) + "px";
}

// 字数计数（与后端 5000 字上限对齐）
const MAX = 5000;
function onInput() {
  const el = document.getElementById("input");
  autoResize(el);
  updateCounter();
  if (el.value.trim()) setMood("listening", "在听你说话…");
}
function updateCounter() {
  const el = document.getElementById("input");
  const c = document.getElementById("counter");
  const n = el.value.length;
  c.textContent = n + " / " + MAX;
  const over = n > MAX;
  c.classList.toggle("warn", over);
  document.getElementById("btn").disabled = !backendReady || over || sending;
}
function escBr(s) { return esc(s).replace(/\n/g, "<br>"); }
function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

// 截图预览缩略图
function showImgPreview() {
  if (!pendingImage) return;
  document.getElementById("imgPrevImg").src = pendingImage;
  document.getElementById("imgPrev").classList.add("show");
}
function clearImgPreview() {
  pendingImage = null;
  document.getElementById("imgPrev").classList.remove("show");
  document.getElementById("imgPrevImg").src = "";
}
document.getElementById("imgPrevX").addEventListener("click", () => {
  clearImgPreview();
  const input = document.getElementById("input");
  input.placeholder = "说说你的事...";
  input.focus();
});

async function send() {
  const input = document.getElementById("input");
  const btn = document.getElementById("btn");
  const chat = document.getElementById("chat");
  const text = input.value.trim();
  if (!backendReady || (!text && !pendingImage) || sending) return;
  if (input.value.length > MAX) {
    chat.insertAdjacentHTML("beforeend", sysBubble("内容超过 5000 字上限，请精简后再发。"));
    scrollBottom(chat);
    return;
  }

  sending = true; btn.disabled = true;
  input.value = ""; input.style.height = "auto";
  const img = pendingImage; clearImgPreview();
  input.placeholder = "说说你的事...";
  updateCounter();
  setMood("thinking", "在想你…");

  const empty = chat.querySelector(".empty");
  if (empty) empty.remove();

  // 用户消息
  let ub = `<div class="msg msg-user">`;
  if (img) ub += `<img src="${img}" alt="截图" />`;
  if (text) ub += `<div>${esc(text)}</div>`;
  ub += `</div>`;
  chat.insertAdjacentHTML("beforeend", ub);

  // 单一「在听」指示 —— 不再分别显示三我的思考过程
  const tk = showThinking(chat);
  scrollBottom(chat);

  try {
    const body = { content: text || "[用户分享了一张截图]" };
    if (img) body.imageBase64 = img;
    const r = await fetch("/api/journal", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    const data = await r.json();

    if (data.success) {
      tk.remove();
      // 1) 本我 ↔ 超我 争吵（逐条缓出为各自独立的消息框，无额外标题）
      const debate = data.data.debate || [];
      if (debate.length) {
        setMood("thinking", "在想你…");
        for (const turn of debate) {
          await delay(550);
          appendDebateTurn(chat, turn);
          scrollBottom(chat);
        }
      }
      // 2) 自我（老大）综合拍板，给出最终最中肯/现实/贴用户的答案
      if (data.data.ego && data.data.ego.text) {
        await delay(350);
        setMood("speaking", "自我在回应你");
        appendVoice(chat, "自我", data.data.ego.text, "msg-ego boss", "自");
        scrollBottom(chat);
      }
      if (data.data.imageNote) {
        chat.insertAdjacentHTML("beforeend", `<div class="hint">📷 ${esc(data.data.imageNote)}</div>`);
      }
      if (data.data.safety?.anyCensored) {
        chat.insertAdjacentHTML("beforeend", `<div class="safety">⚠ 部分内容因安全策略被调整</div>`);
      }
      // 联网检索来源：透明可溯，便于用户核对真实性
      if (Array.isArray(data.data.sources) && data.data.sources.length) {
        const links = data.data.sources
          .map((s) => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>`)
          .join("<br>");
        chat.insertAdjacentHTML(
          "beforeend",
          `<details class="sources"><summary>🔍 参考来源（${data.data.sources.length}）</summary>${links}</details>`,
        );
      }
      // 回复结束，伙伴恢复待机
      setMood("idle", "在陪着你");
    } else {
      tk.remove();
      chat.insertAdjacentHTML("beforeend", sysBubble(data.error || "出错了"));
      setMood("idle", "在陪着你");
    }
  } catch (e) {
    tk.remove();
    chat.insertAdjacentHTML("beforeend", sysBubble("连接失败——服务是否已启动？"));
    setMood("idle", "在陪着你");
  }

  scrollBottom(chat);
  sending = false; updateCounter(); input.focus();
}

function showThinking(chat) {
  const el = document.createElement("div");
  el.className = "thinking";
  el.innerHTML = "";
  chat.appendChild(el);
  return el;
}
function appendVoice(chat, name, text, cls, letter) {
  const el = document.createElement("div");
  el.className = "msg " + cls;
  el.innerHTML = `<div class="head"><span class="av">${letter}</span><span class="nm">${name}</span></div>${escBr(text)}`;
  chat.appendChild(el);
}
function appendDebateTurn(chat, turn) {
  const isId = turn.speaker === "id";
  const el = document.createElement("div");
  el.className = "msg " + (isId ? "msg-id" : "msg-superego");
  el.innerHTML = `<div class="head"><span class="av">${isId ? "本" : "超"}</span><span class="nm">${isId ? "本我" : "超我"}</span></div>${escBr(turn.text)}`;
  chat.appendChild(el);
}
function sysBubble(msg) {
  return `<div class="msg msg-ego"><div class="head"><span class="av" style="background:#7ee787"></span><span class="nm" style="color:#7ee787">系统</span></div>${esc(msg)}</div>`;
}

function scrollBottom(el) { el.scrollTop = el.scrollHeight; }
function esc(s) { return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

// 窗口控制（Electron）
window.electronAPI = window.electronAPI || {
  minimize() { /* overridden by preload */ },
  close() { window.close(); }
};

// ====== 个性化：顶部舞台图片（仅存本机 localStorage） ======
const STAGE_KEY = "tj_stage_image";
const STAGE_META_KEY = "tj_stage_meta";
const STAGE_SRC_KEY = "tj_stage_src";   // "idb" = GIF/视频(IndexedDB)；"ls" = 普通图片(localStorage)
let stageUrl = null;                    // 当前媒体 object URL，render 时复用/释放

// IndexedDB：存 GIF / 视频原始 Blob（不重新编码，保留动效）；普通图片仍走 localStorage
const STAGE_DB_NAME = "tj_stage_db";
const STAGE_STORE = "media";
const STAGE_REC_KEY = "current";
function openStageDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(STAGE_DB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STAGE_STORE)) db.createObjectStore(STAGE_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function saveStageMedia(rec) {
  const db = await openStageDB();
  await new Promise((resolve, reject) => {
    const tx = db.transaction(STAGE_STORE, "readwrite");
    tx.objectStore(STAGE_STORE).put(rec, STAGE_REC_KEY);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
  db.close();
}
async function loadStageMedia() {
  const db = await openStageDB();
  const rec = await new Promise((resolve, reject) => {
    const tx = db.transaction(STAGE_STORE, "readonly");
    const get = tx.objectStore(STAGE_STORE).get(STAGE_REC_KEY);
    get.onsuccess = () => resolve(get.result || null);
    get.onerror = () => reject(get.error);
  });
  db.close();
  return rec;
}
async function clearStageMedia() {
  const db = await openStageDB();
  await new Promise((resolve, reject) => {
    const tx = db.transaction(STAGE_STORE, "readwrite");
    tx.objectStore(STAGE_STORE).delete(STAGE_REC_KEY);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
  db.close();
}

function formatSize(bytes) {
  if (!bytes && bytes !== 0) return "";
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
  return (bytes / 1024 / 1024).toFixed(2) + " MB";
}

async function renderStage() {
  const stage = document.getElementById("stage");
  const mediaBox = document.getElementById("stageMedia");
  const pv = document.getElementById("popPreview");
  const meta = document.getElementById("popMeta");
  const metaName = document.getElementById("popMetaName");
  const metaSize = document.getElementById("popMetaSize");
  const clearBtn = document.getElementById("popClearBtn");

  // 读取当前设置的媒体：优先按来源标记（IDB 存 GIF/视频，localStorage 存普通图片），兼容旧数据
  let rec = null;
  const srcPref = localStorage.getItem(STAGE_SRC_KEY);
  if (srcPref === "idb") {
    try { rec = await loadStageMedia(); } catch (_) {}
  } else if (srcPref === "ls") {
    const d = localStorage.getItem(STAGE_KEY);
    if (d) rec = { type: "image", src: d, name: "图片", legacy: true };
  } else {
    try { rec = await loadStageMedia(); } catch (_) {}
    if (!rec && localStorage.getItem(STAGE_KEY)) {
      rec = { type: "image", src: localStorage.getItem(STAGE_KEY), name: "图片", legacy: true };
    }
  }

  if (rec) {
    stage.classList.add("has-image");
    pv.classList.add("has-image");
    clearBtn.disabled = false;
    if (stageUrl) { URL.revokeObjectURL(stageUrl); stageUrl = null; }
    const url = rec.legacy ? rec.src : URL.createObjectURL(rec.blob);
    if (!rec.legacy) stageUrl = url;
    const isVid = !rec.legacy && (rec.isVideo || (rec.type && rec.type.startsWith("video/")));
    const tag = isVid
      ? `<video src="${url}" autoplay loop muted playsinline></video>`
      : `<img src="${url}" alt="" />`;
    mediaBox.innerHTML = tag;
    pv.innerHTML = tag;
    if (rec.name || (rec.size && !rec.legacy)) {
      meta.classList.add("show");
      metaName.textContent = rec.name || "媒体";
      const dim = (rec.w && rec.h) ? `${rec.w}×${rec.h} · ` : "";
      const sz = rec.legacy ? "—" : formatSize(rec.size);
      metaSize.textContent = dim + sz;
    } else {
      meta.classList.remove("show");
    }
  } else {
    stage.classList.remove("has-image");
    if (stageUrl) { URL.revokeObjectURL(stageUrl); stageUrl = null; }
    mediaBox.innerHTML = "";
    pv.classList.remove("has-image");
    pv.innerHTML =
      '<div class="preview-empty" id="popEmpty">' +
        '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
          '<rect x="3" y="5" width="18" height="14" rx="2.5"/>' +
          '<circle cx="9" cy="11" r="1.6"/>' +
          '<path d="M21 17l-5-5-7 7"/>' +
        '</svg>' +
        '<b>未设置形象</b>' +
        '<small>支持 图片 / GIF / 视频(MP4·WebM)</small>' +
      '</div>';
    clearBtn.disabled = true;
    meta.classList.remove("show");
  }
}
function togglePop() {
  document.getElementById("pop").classList.toggle("show");
}
async function onStageFile(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const isVideo = file.type.startsWith("video/");
  const isGif = file.type === "image/gif";

  if (isVideo || isGif) {
    // GIF / 视频：原始 Blob 存 IndexedDB，不重新编码（保留动效）
    const rec = { blob: file, type: file.type, name: file.name, size: file.size, w: 0, h: 0, isVideo: isVideo };
    try {
      await new Promise((res) => {
        const probe = document.createElement(isVideo ? "video" : "img");
        probe.preload = "metadata";
        probe.onloadedmetadata = probe.onload = () => {
          rec.w = probe.videoWidth || probe.width || 0;
          rec.h = probe.videoHeight || probe.height || 0;
          res();
        };
        probe.onerror = () => res();
        probe.src = URL.createObjectURL(file);
      });
    } catch (_) {}
    try { await saveStageMedia(rec); } catch (_) {}
    localStorage.setItem(STAGE_SRC_KEY, "idb");
    localStorage.removeItem(STAGE_KEY);
    localStorage.removeItem(STAGE_META_KEY);
    renderStage();
  } else {
    // 普通图片：缩放压缩后存 localStorage（轻量、兼容旧路径）
    const reader = new FileReader();
    reader.onload = () => {
      const src = reader.result;
      const im = new Image();
      im.onload = () => {
        const maxW = 480;
        const scale = Math.min(1, maxW / im.width);
        const w = Math.max(1, Math.round(im.width * scale));
        const h = Math.max(1, Math.round(im.height * scale));
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(im, 0, 0, w, h);
        let out = src;
        try { out = canvas.toDataURL("image/jpeg", 0.82); } catch (_) {}
        localStorage.setItem(STAGE_KEY, out);
        try {
          localStorage.setItem(STAGE_META_KEY, JSON.stringify({ name: file.name, size: file.size, w: w, h: h }));
        } catch (_) {}
        localStorage.setItem(STAGE_SRC_KEY, "ls");
        clearStageMedia().catch(() => {});
        renderStage();
      };
      im.src = src;
    };
    reader.readAsDataURL(file);
  }
  e.target.value = "";
}
function clearStage() {
  localStorage.removeItem(STAGE_KEY);
  localStorage.removeItem(STAGE_META_KEY);
  localStorage.removeItem(STAGE_SRC_KEY);
  clearStageMedia().catch(() => {});
  renderStage();
}

// 新:隐藏的 file input + 美化按钮的桥接
(function wirePop() {
  const pick = document.getElementById("popPickBtn");
  const file = document.getElementById("fileInput");
  const clear = document.getElementById("popClearBtn");
  if (pick && file) pick.addEventListener("click", () => file.click());
  if (file) file.addEventListener("change", onStageFile);
  if (clear) clear.addEventListener("click", clearStage);
  // 主题分段控件:点谁就调 TriuneTheme.set,active 态由 theme.js 的 syncControls 自动同步
  document.querySelectorAll(".pop .theme-seg-new .topt").forEach((b) => {
    b.addEventListener("click", () => {
      const v = b.getAttribute("data-theme-opt");
      if (window.TriuneTheme && window.TriuneTheme.set) window.TriuneTheme.set(v);
    });
  });
})();
// 点击弹层外部关闭
document.addEventListener("click", (e) => {
  const pop = document.getElementById("pop");
  if (!pop.classList.contains("show")) return;
  if (pop.contains(e.target)) return;
  if (e.target.closest && e.target.closest('[onclick="togglePop()"]')) return;
  pop.classList.remove("show");
});

/* ---- 启动自检：开窗先连 /api/health，连不上就提示并保持禁用、每 4s 自动重试 ---- */
function setReady(ok) {
  backendReady = ok;
  document.getElementById("input").disabled = !ok;
  updateCounter();
}
async function checkHealth() {
  const banner = document.getElementById("banner");
  banner.className = "banner checking";
  banner.innerHTML = `<span class="spin"></span> 正在连接后端…`;
  try {
    const r = await fetch("/api/health", { cache: "no-store" });
    const data = await r.json().catch(() => null);
    if (r.ok && data && data.status === "ok") {
      setReady(true);
      banner.className = "banner ok";
      banner.innerHTML = `✓ 已连接 · 模型 ${esc(data.model || "")}`;
      setTimeout(() => { if (backendReady) banner.style.display = "none"; }, 2500);
      return;
    }
    throw new Error("bad status");
  } catch (e) {
    setReady(false);
    banner.className = "banner err";
    banner.innerHTML = `⚠ 后端未启动，请先在项目目录运行 <code>npm run dev</code>（窗口关了点右下角托盘图标、或按 Ctrl+Shift+J 找回）`;
    healthTimer = setTimeout(checkHealth, 4000); // 自动重试，后端起好即恢复
  }
}
renderStage();
checkHealth();
</script>
<script src="/theme.js"></script>
<script src="/import-diary.js"></script>
