<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Triune · 聊天日志</title>
<style>
  :root{
    --bg:#f4f6f9; --panel:#ffffff; --panel-2:#fbfcfe; --border:#e6e9ef;
    --ink:#1f2430; --muted:#838b9a; --muted-2:#aab1bf;
    --accent:#2563eb; --accent-soft:#eaf1fe; --accent-ink:#1d4ed8;
    --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
  .wrap{max-width:860px;margin:0 auto;padding:22px 22px 60px;}

  .topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .topbar h1{margin:0;font-size:21px;font-weight:650;}
  .topbar p{margin:6px 0 0;font-size:13px;color:var(--muted);line-height:1.6;}
  .topbar .who{font-size:12px;color:var(--accent-ink);background:var(--accent-soft);
        padding:6px 12px;border-radius:999px;font-weight:500;}
  a.back{font-size:12.5px;color:var(--accent-ink);text-decoration:none;}
  a.back:hover{text-decoration:underline;}

  .toolbar{display:flex;gap:10px;margin-top:18px;align-items:center;flex-wrap:wrap;}
  .toolbar input{flex:1;min-width:220px;border:1px solid var(--border);border-radius:10px;
        padding:10px 13px;font-size:13px;color:var(--ink);background:var(--panel);font-family:inherit;}
  .toolbar input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  button{font-family:inherit;font-size:13px;border:1px solid var(--border);background:var(--panel);
         color:var(--ink);padding:9px 16px;border-radius:9px;cursor:pointer;transition:.15s;font-weight:500;}
  button:hover{border-color:var(--muted-2);transform:translateY(-1px);}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  button.primary:hover{filter:brightness(1.05);}
  button.danger{color:#c0392b;border-color:#f0c5c0;background:#fff;}
  button.danger:hover{background:#fdf2f0;}
  button.mini{padding:5px 11px;font-size:12px;border-radius:7px;}

  .stat{font-size:12.5px;color:var(--muted);margin-top:14px;}

  .logs{display:flex;flex-direction:column;gap:12px;margin-top:10px;}
  .log{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
       box-shadow:var(--shadow);padding:14px 16px;}
  .log .head{display:flex;align-items:center;gap:10px;}
  .log .dt{font-size:11.5px;color:var(--muted-2);}
  .log .spacer{flex:1;}
  .log .user{font-size:13.5px;font-weight:600;line-height:1.65;margin-top:8px;word-break:break-word;white-space:pre-wrap;}
  .log .user::before{content:"🙋 ";}
  details{margin-top:8px;}
  details summary{cursor:pointer;font-size:12px;color:var(--accent-ink);user-select:none;}
  details summary:hover{text-decoration:underline;}
  .reply{font-size:12.5px;line-height:1.7;margin-top:8px;padding:9px 12px;border-radius:9px;word-break:break-word;white-space:pre-wrap;}
  .reply.r-id{background:#fff4ec;border:1px solid #f5ddc9;}
  .reply.r-ego{background:#edf7f1;border:1px solid #cfe8da;}
  .reply.r-superego{background:#f3edff;border:1px solid #e0d3fa;}
  .reply .tag{font-weight:700;font-size:11.5px;margin-right:6px;}
  .r-id .tag{color:#c2600e;}
  .r-ego .tag{color:#0a7a44;}
  .r-superego .tag{color:#7c3aed;}
  mark{background:#ffe58a;border-radius:3px;padding:0 2px;}

  .empty{color:var(--muted);font-size:13px;text-align:center;padding:40px 0;}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(8px);background:#1f2430;
         color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;transition:.22s;pointer-events:none;
         box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:90vw;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <h1>聊天日志</h1>
      <p>这里保存了你和三我的每一次对话。支持按关键词搜索，也可以删除单条或清空全部记录。</p>
    </div>
    <div style="display:flex;gap:10px;align-items:center;">
      <span class="who" id="who">用户：default</span>
      <a class="back" href="/widget.html">← 回到陪伴窗</a>
    </div>
  </div>

  <div class="toolbar">
    <input id="q" type="text" placeholder="搜索聊天记录…（你的消息、三我回复、争吵内容都能搜到）" />
    <button class="primary" id="search-btn">搜索</button>
    <button id="reset-btn">显示全部</button>
    <button class="danger" id="clear-btn">清空全部记录</button>
  </div>

  <div class="stat" id="stat">加载中…</div>
  <div class="logs" id="logs"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const userId = new URLSearchParams(location.search).get("userId") || "default";
document.getElementById("who").textContent = "用户：" + userId;

let currentQ = "";

function toast(msg){
  const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 1600);
}
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmtDate(iso){
  try { return new Date(iso).toLocaleString("zh-CN", {year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}); }
  catch { return ""; }
}
/** 转义后高亮命中的关键词 */
function hl(s, q){
  const safe = esc(s);
  if(!q) return safe;
  try{
    const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
    return safe.replace(re, (m)=>"<mark>" + m + "</mark>");
  }catch{ return safe; }
}

async function load(q){
  currentQ = (q||"").trim();
  const stat = document.getElementById("stat");
  stat.textContent = "加载中…";
  try{
    const url = "/api/journal/" + encodeURIComponent(userId) + "/logs" +
                (currentQ ? "?q=" + encodeURIComponent(currentQ) : "");
    const r = await fetch(url);
    const j = await r.json();
    if(!j.success){ stat.textContent = "加载失败：" + (j.error||""); return; }
    stat.textContent = currentQ
      ? "找到 " + j.count + " 条包含「" + currentQ + "」的记录"
      : "共 " + j.count + " 条聊天记录";
    render(j.data || []);
  }catch(e){ stat.textContent = "加载失败：" + e.message; }
}

function render(list){
  const box = document.getElementById("logs");
  if(list.length === 0){
    box.innerHTML = '<div class="empty">' + (currentQ ? "没有找到匹配的记录" : "还没有聊天记录，去和三我聊聊吧") + '</div>';
    return;
  }
  box.innerHTML = "";
  list.forEach(rec=>{
    const el = document.createElement("div");
    el.className = "log";
    let replies = "";
    if(rec.idText)       replies += '<div class="reply r-id"><span class="tag">本我</span>' + hl(rec.idText, currentQ) + '</div>';
    if(rec.egoText)      replies += '<div class="reply r-ego"><span class="tag">自我</span>' + hl(rec.egoText, currentQ) + '</div>';
    if(rec.superegoText) replies += '<div class="reply r-superego"><span class="tag">超我</span>' + hl(rec.superegoText, currentQ) + '</div>';
    el.innerHTML =
      '<div class="head">' +
        '<span class="dt">' + fmtDate(rec.timestamp) + (rec.debateCount ? ' · ⚡争吵 ' + rec.debateCount + ' 条' : '') + '</span>' +
        '<span class="spacer"></span>' +
        '<button class="danger mini">删除</button>' +
      '</div>' +
      '<div class="user">' + hl(rec.diary, currentQ) + '</div>' +
      (replies ? '<details' + (currentQ ? ' open' : '') + '><summary>三我的回复</summary>' + replies + '</details>' : '');
    el.querySelector("button").addEventListener("click", ()=>delOne(rec.id, el));
    box.appendChild(el);
  });
}

async function delOne(id, el){
  if(!confirm("确定删除这条聊天记录吗？删除后无法恢复。")) return;
  try{
    const r = await fetch("/api/journal/" + encodeURIComponent(userId) + "/logs/" + encodeURIComponent(id), { method:"DELETE" });
    const j = await r.json();
    if(j.success){ el.remove(); toast("已删除"); load(currentQ); }
    else toast("删除失败：" + (j.error||""));
  }catch(e){ toast("删除失败：" + e.message); }
}

document.getElementById("clear-btn").addEventListener("click", async ()=>{
  if(!confirm("确定清空全部聊天记录吗？此操作无法恢复！")) return;
  if(!confirm("再确认一次：真的要删掉所有记录？")) return;
  try{
    const r = await fetch("/api/journal/" + encodeURIComponent(userId) + "/logs", { method:"DELETE" });
    const j = await r.json();
    if(j.success){ toast("已清空 " + j.deleted + " 条记录"); load(""); document.getElementById("q").value=""; }
    else toast("清空失败：" + (j.error||""));
  }catch(e){ toast("清空失败：" + e.message); }
});

document.getElementById("search-btn").addEventListener("click", ()=>load(document.getElementById("q").value));
document.getElementById("reset-btn").addEventListener("click", ()=>{ document.getElementById("q").value=""; load(""); });
document.getElementById("q").addEventListener("keydown", (e)=>{ if(e.key==="Enter") load(e.target.value); });

load("");
</script>
</body>
</html>
