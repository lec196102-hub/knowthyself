name: 功能建议 / Feature Request
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 这个功能是为了解决什么痛点？没有它你会怎样将就？
      placeholder: 例如：希望能在桌面小组件上看到今日心情趋势，而不是每次都翻日记
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你的设想
      description: 你希望这个功能长什么样？怎么交互？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / 参考
      description: 有没有别的做法？有没有见过类似实现可参考？（可附链接）
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 大致涉及模块
      options:
        - 桌宠 UI（widget.html）
        - 后端 / 接口
        - 三我人格引擎
        - 存储 / 加密
        - 个性化素材
        - 文档 / 其他
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我理解老己是本地优先、隐私守护产品，建议不应要求联网上传用户日记/画像
          required: true
